# ComponentType records for WG1 (WaveguideResonator v1, Phase A).
#
# Pilot scale, per docs/MODEL_PATTERNS.md's digital-waveguide archetype and
# scratch/WaveguideResonator-v1-Specification-and-Reasoning-Model.md
# section 9.1: only the components Phase A actually built, described from
# the real implementation, not speculatively ahead of it. Schema follows
# the spec's own suggested ComponentType shape.
#
# See docs/MODEL_DESIGN_CHARTER.md for the project-level intent these
# records are building toward (models as executable causal lessons,
# organized around 5 causal layers: gesture/event process, driver/energy
# source, coupling mechanism, resonator/propagating structure, radiation/
# observation). OPEN OMISSION relative to that charter, noted here rather
# than papered over: WG1/WG2/WG3 have no distinct GESTURE-OR-EVENT-PROCESS
# component at all. `InitialConditionExciter` (below) is squarely the
# charter's layer-2 DRIVER role (it supplies the energy/initial
# condition); the decision of WHEN a pluck happens is made entirely
# outside this model, by the app's single mousedown handler calling
# play() -- there is no scripted/statistical event generator analogous to
# archetype 4's phaseEventProcessor-family worklets elsewhere in this
# library. This is a genuine, currently-uninstantiated layer for this
# model family, not a modeling error -- a future compliant-striker or
# stick-slip-bow excitation mechanism (see the charter's "Excitation as
# an Early Example of the Method" section) would be the natural place to
# introduce one, since "when/how often does contact happen" becomes a
# real design question once excitation is state-dependent or statistical
# rather than a single scripted trigger.

- id: component.fractional-delay-waveguide
  name: Fractional-Delay Waveguide
  roles:
    - propagation
  physical_domain: one-dimensional-wave-propagation
  implementation_family:
    - digital-waveguide
  stateful: true
  linear_regime: linear
  energy_behavior: stores-and-circulates
  inputs:
    - feedback-sample
  outputs:
    - delayed-sample
  parameters:
    - parameter.frequency
  preconditions:
    - delay-samples-positive
    - delay-samples-within-buffer-bounds
  affordances:
    - sustained-pitched-resonance
    - continuous-live-retuning
    - swappable-fractional-delay-interpolation-strategy (readAt()/read()
      accept any interpolator implementing .read()/.reset(); see
      component.linear-interpolator, component.allpass1-interpolator,
      component.lagrange3-interpolator below -- interpolationMode is a
      construction-time/developer choice, not a user-facing Parameter)
  limitations:
    - single-loop-not-yet-bidirectional-two-rail
    - no-independently-addressable-spatial-position
    - residual-frequency-dependent-loss-even-with-the-default-interpolator
      (much smaller than linear's own effect, but not zero at the
      supported frequency range's extremes -- see
      component.lagrange3-interpolator)
  code_ref: soundlib/utilities/FractionalDelayWaveguide.js

- id: component.linear-interpolator
  name: Linear Interpolator
  roles:
    - fractional-delay-interpolation-strategy
  physical_domain: not-applicable-numerical
  implementation_family:
    - fir-interpolation
  stateful: false
  linear_regime: linear
  energy_behavior: mildly-dissipates-at-high-frequency
  inputs:
    - delay-line-buffer
    - fractional-offset
  outputs:
    - interpolated-sample
  parameters: []
  preconditions: []
  affordances:
    - simplest-reference-implementation
    - zero-per-tap-state-safe-to-share-one-instance-across-every-tap-site
    - usable-as-a-deliberately-characterized-lo-fi-propagation-behavior
  limitations:
    - magnitude-response-rolls-off-toward-nyquist (2-point straight-line
      fit is a coarse approximation to ideal bandlimited interpolation)
    - when-used-as-the-fractional-delay-waveguides-loop-tap-this-rolloff-
      compounds-once-per-round-trip-for-wg1-and-twice-for-wg2 (see
      soundlib/models/WG1/knowledge/causal-claims.yaml's
      claim.linear-interpolation-collapses-at-high-frequency and WG2's
      own claim.two-rail-structure-shortens-decay-more-than-single-loop)
    - no-longer-the-default-as-of-the-interpolation-strategy-investigation
      (kept selectable as a reference/regression mode)
  code_ref: soundlib/utilities/LinearInterpolator.js

- id: component.allpass1-interpolator
  name: First-Order Allpass Interpolator
  roles:
    - fractional-delay-interpolation-strategy
  physical_domain: not-applicable-numerical
  implementation_family:
    - iir-interpolation
  stateful: true
  linear_regime: linear
  energy_behavior: preserves-magnitude-by-construction
  inputs:
    - current-sample
    - fractional-offset
  outputs:
    - interpolated-sample
  parameters: []
  preconditions:
    - one-instance-per-tap-site-required (carries persistent state -- NOT
      safe to share a single instance across multiple taps, unlike
      component.linear-interpolator/component.lagrange3-interpolator)
  affordances:
    - unity-magnitude-response-by-construction (a=(1-frac)/(1+frac),
      y[n]=a*x[n]+x[n-1]-a*y[n-1])
  limitations:
    - frequency-dependent-phase-group-delay-introduces-real-tuning-error
      (measured up to -18.3% at WG2/3000Hz -- over 2.5 semitones flat --
      growing with frequency, unlike linear's/lagrange3's small and
      frequency-stable error)
    - measurable-inharmonicity-even-at-low-harmonics (-0.5% at harmonics
      1/3/6 @220Hz, where linear and lagrange3 both showed 0%)
    - coefficient-change-on-live-retuning-can-produce-a-large-transient
      (measured ~40x amplitude spike, peak 23.0 vs ~0.5-0.6 for
      linear/lagrange3, during a live 220->440Hz frequency ramp -- a real
      risk in this codebase since frequency is continuously live-
      retunable in every model)
    - rejected-as-the-default-on-this-evidence (see
      soundlib/models/WG1/knowledge/causal-claims.yaml's
      claim.lagrange3-interpolation-resolves-energy-loss-without-tuning-regression
      for the full 3-way comparison)
  code_ref: soundlib/utilities/AllpassInterpolator.js

- id: component.lagrange3-interpolator
  name: 3rd-Order Lagrange Interpolator
  roles:
    - fractional-delay-interpolation-strategy
  physical_domain: not-applicable-numerical
  implementation_family:
    - fir-interpolation
  stateful: false
  linear_regime: linear
  energy_behavior: closely-preserves-magnitude
  inputs:
    - delay-line-buffer
    - fractional-offset
  outputs:
    - interpolated-sample
  parameters: []
  preconditions: []
  affordances:
    - default-interpolator-as-of-the-interpolation-strategy-investigation
    - zero-per-tap-state-safe-to-share-one-instance-across-every-tap-site
    - fixes-linear's-high-frequency-energy-collapse-without-introducing-
      allpass1's-tuning-or-transient-regressions (measured -- see
      soundlib/models/WG1/knowledge/causal-claims.yaml's
      claim.lagrange3-interpolation-resolves-energy-loss-without-tuning-regression)
  limitations:
    - still-not-perfect (WG2 at the extreme top of the supported range,
      3000Hz, retains a measurable residual -- internal-energy T60 ~1.4s
      rather than fully preserved, a ~24x improvement over linear's
      ~0.058s there but not a complete fix)
    - ~2.2x-the-cpu-cost-of-linear (51ms vs 24ms for a 2,000,000-sample
      render -- negligible in absolute terms)
    - 4-point-support-requires-slightly-more-delay-line-history-than-
      linears-2-point-support (no observed practical impact at the buffer
      sizes this codebase uses)
  code_ref: soundlib/utilities/LagrangeInterpolator.js

- id: component.loop-loss-filter
  name: Loop Loss Filter
  roles:
    - loss
  physical_domain: energy-dissipation
  implementation_family:
    - scalar-gain
  stateful: false
  linear_regime: linear
  energy_behavior: dissipates
  inputs:
    - sample
  outputs:
    - attenuated-sample
  parameters:
    - parameter.decay-time
  preconditions:
    - decay-time-positive
    - delay-samples-known-for-current-loop-length
  affordances:
    - independently-tunable-broadband-decay
  limitations:
    - broadband-only-no-frequency-dependent-loss-yet
    - coefficient-must-be-rederived-whenever-loop-length-changes-not-just-decayTime
  code_ref: soundlib/utilities/LoopLossFilter.js

- id: component.rigid-termination
  name: Rigid Termination
  roles:
    - termination
  physical_domain: boundary-reflection
  implementation_family:
    - scalar-gain
  stateful: false
  linear_regime: linear
  energy_behavior: conserves-or-mildly-dissipates
  inputs:
    - incident-sample
  outputs:
    - reflected-sample
  parameters: []
  preconditions: []
  affordances:
    - near-lossless-round-trip-reflection
  limitations:
    - not-frequency-dependent
    - fixed-not-user-facing-in-phase-a
  code_ref: soundlib/utilities/RigidTermination.js

- id: component.initial-condition-exciter
  name: Initial Condition Exciter
  roles:
    - exciter
  physical_domain: energy-injection
  implementation_family:
    - buffer-fill
  stateful: true
  linear_regime: not-applicable
  energy_behavior: injects
  inputs:
    - trigger-event
  outputs:
    - initial-loop-state
  parameters:
    - parameter.energy
    - parameter.excitation-type
  preconditions:
    - seeded-random-source-available
  affordances:
    - one-shot-pluck-like-excitation
  limitations:
    - phase-a-supports-only-noise-and-impulse-shapes
    - no-excitation-position-yet-uniform-fill-only
  code_ref: soundlib/utilities/InitialConditionExciter.js
