- id: claim.continuous-drive-steady-state-gain-is-enormous-even-at-low-q
  subject: component.body-mode-bank
  relation: discovered-during-implementation-that
  object: feature.a-continuously-driven-near-unity-pole-resonator-needs-
    explicit-per-mode-gain-compensation
  conditions: []
  expected_direction: not-applicable (a discovered necessity, not a magnitude trend)
  confidence: high
  scope: component.body-mode-bank
  mechanism: a-two-pole-resonator-s-own-steady-state-continuous-drive-gain-
    at-resonance-scales-with-1-over-(1-r)-where-r-is-the-pole-radius-which-
    stays-close-to-1-even-at-modest-Q-because-decaySeconds-expressed-in-
    SAMPLES-at-audio-sample-rates-is-still-hundreds-of-samples
  possible_confounds:
    - an-impulse-response-alone-would-not-reveal-this (a single impulse's
      total injected energy is tiny compared to a sustained drive's --
      checking only impulse response, as BodyModeBank.test.js's own
      per-mode frequency/decay checks do, would miss this entirely;
      caught instead via full-pipeline gain-staging measurement with
      CONTINUOUS excitation, matching how transmittedSignal actually
      drives the body in practice)
  validation:
    method: measure-worst-case-render-peak-RMS-across-a-parameter-grid-
      then-re-measure-at-a-deliberately-tiny-monitor-gain-so-
      OutputConditioner-s-hard-clamp-cannot-mask-the-true-unclamped-
      magnitude-dividing-back-out
    metric: implied-true-unclamped-peak-at-bodyRadiationGain-equals-1
    result: >
      First pass (decaySeconds chosen directly, 0.08-0.15s, without
      checking the resulting Q): measured unclamped peak ~400x input
      amplitude. Root cause found to be TWO compounding errors: (1) those
      decaySeconds values implied Q~87-178 at these frequencies (Q =
      pi*f0*decaySeconds), not "low-Q" as intended. (2) even after
      correcting to a genuinely low Q=4 (decaySeconds derived via
      decayMath.js's decaySecondsFromQ), the per-mode steady-state
      continuous-drive gain at resonance (gain=1, uncompensated) measured
      6828.88x (185Hz), 2027.39x (340Hz), 921.84x (505Hz), 468.26x
      (710Hz) at 48000Hz sample rate -- confirmed by an independent
      closed-form formula (decayMath.js's new
      discreteResonatorGainAtCenter()) matching the simulated measurement
      exactly. This gain is also NOT sample-rate invariant: the same
      Q/frequency measured ~15.5% lower at 44100Hz than 48000Hz. Fixed by
      computing per-mode compensation live, at BodyModeBank's own
      construction time, using the actual runtime sampleRate.

