- id: claim.one-bridge-encounter-per-round-trip-equals-one-fundamental-period
  subject: component.bidirectional-waveguide
  relation: confirmed-by-direct-code-inspection-that
  object: feature.the-bridge-termination-is-encountered-exactly-f0-times-
    per-second
  conditions: []
  expected_direction: not-applicable (a structural/architectural fact,
    not a magnitude trend)
  confidence: high
  scope: model_graph.wg3-with-body-c5-1
  mechanism: railLength-equals-(sampleRate-over-frequency-minus-
    compensationSamples)-over-2-so-a-full-round-trip-(2-times-railLength-
    samples)-equals-sampleRate-over-frequency-samples-exactly-one-
    fundamental-period-at-zero-dispersion-compensation-and-pitchLocked-
    compensation-is-specifically-designed-to-preserve-this-same-total-
    round-trip-period-when-active
  possible_confounds:
    - could-pitchLocked-dispersion-compensation-break-this-relationship
      (checked directly -- pitchLocked's own stated purpose is keeping
      the fundamental in tune, which requires preserving this exact
      round-trip period; not assumed, confirmed against
      wg2Processor.js's own railLength computation)
  validation:
    method: direct-code-inspection-of-BidirectionalWaveguide.js-tick()-
      and-wg2Processor.js-s-own-railLength-computation-not-assumed-from-
      the-user-s-own-proposed-model
    metric: not-applicable-a-structural-verification-not-a-measurement
    result: >
      Confirmed directly: wg2Processor.js computes railLength =
      (sampleRate/frequency - compensationSamples)/2, and
      BidirectionalWaveguide.tick() calls bridgeTermination.reflect()
      exactly once per sample. This justifies
      r = exp(-1/(tau_bridge*f0)) directly (bridgeDecayMath.js's
      computeBridgeReflectionCoefficient), reusing decayMath.js's own
      perSampleCoefficient() with f0 standing in for "sample rate" --
      see soundlib/utilities/test/wg3Pipeline.test.js's own "#2" test
      for the resulting r-increases-with-frequency confirmation.

- id: claim.bridgedecayval-to-seconds-mapping-is-geometric-not-linear
  subject: parameter.bridge-decay-val
  relation: guarantees-by-construction
  object: feature.equal-knob-travel-corresponds-to-equal-ratios-of-
    bridge-decay-time-not-equal-absolute-seconds
  conditions: []
  expected_direction: not-applicable (an exactness guarantee, not a trend)
  confidence: high
  scope: model_graph.wg3-with-body-c5-1
  mechanism: bridgeDecayValToSeconds(v,-min,-max)-equals-min-times-(max-
    over-min)-raised-to-v-so-v-equals-0.5-lands-on-sqrt(min-times-max)-
    the-geometric-mean-not-the-arithmetic-mean-(min-plus-max)-over-2
  possible_confounds: []
  validation:
    method: direct-evaluation-of-bridgeDecayValToSeconds-at-0-0.5-1-
      against-the-provisional-0.05-30-second-range
    metric: exact-value-comparison
    result: >
      bridgeDecayValToSeconds(0, 0.05, 30) = 0.05 (exact);
      bridgeDecayValToSeconds(0.5, 0.05, 30) = 1.2247 (matches
      sqrt(0.05*30) = 1.2247 exactly, NOT the arithmetic mean 15.025);
      bridgeDecayValToSeconds(1, 0.05, 30) = 30 (exact). Confirms the
      geometric-mapping design decision reached in discussion (not a
      LogarithmicParameter subclass -- Parameter.js itself is untouched;
      the mapping lives entirely in bridgeDecayMath.js).

