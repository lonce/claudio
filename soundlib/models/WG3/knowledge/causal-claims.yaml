# CausalClaim records for WG3 (WaveguideResonator v1, Phase C continued).
# Pilot scale, same two-entity-type discipline as WG1's/WG2's own
# causal-claims.yaml -- every claim below is backed by an actual
# measurement (run against FilteredTermination.js/BridgeTermination.js
# directly, or against wg3PipelineCore.js's renderWg3Pluck), not asserted
# from the design alone. See soundlib/utilities/test/
# FilteredTermination.test.js and wg3Pipeline.test.js for the automated
# versions of these same checks.
#
# C.5.2 adds a new `status:` field (first use in this codebase),
# alongside (not replacing) `confidence:` -- confidence is "how sure are
# we this measurement is right"; status is "what KIND of claim is this":
#   confirmed-dsp-property  -- a general fact about the mechanism itself,
#                              not tied to one specific config/instance.
#   measured-in-this-model  -- true of this exact implementation/config,
#                              not asserted to generalize beyond it.
#   perceptual-hypothesis   -- explicitly NOT validated by DSP
#                              measurement alone; a hypothesis recorded
#                              for a human listener to judge, which a
#                              render comparison can't confirm or refute
#                              on its own.
# Every claim recorded BEFORE C.5.2 predates this field and is
# `measured-in-this-model` by default where not otherwise obvious --
# not retroactively re-tagged, since none of them were mis-stated by its
# absence.
#
# Pre-C.5.3 reparameterization adds a `status: superseded` value (plus
# `superseded_by:`/`superseded_note:` fields) -- used when a later
# directive deliberately overrides an earlier guarantee rather than
# merely refining it (here: the energy-accounting identity replacing the
# amplitude-accounting one, which cannot both hold exactly at once). The
# superseded claim is kept in place, not deleted, as a record of what
# changed and why -- consistent with this project's general discipline
# of recording decisions rather than erasing history.
#
# OPEN REPRESENTATIONAL QUESTION (flagged per docs/MODEL_DESIGN_CHARTER.md's
# instruction not to force a new concept into an existing category):
# `superseded` is NOT one of the charter's 5 status values
# (confirmed-dsp-property / measured-in-this-model / perceptual-
# hypothesis / provisional-design-hypothesis / known-numerical-artifact).
# It answers a genuinely different question -- not "what KIND of claim is
# this" but "is this claim still the currently-accepted one, or has a
# later finding overridden it" -- and currently shares the same `status:`
# field as the charter's epistemic-kind vocabulary, conflating two
# orthogonal axes into one field. A cleaner future shape might be a
# separate `active: true/false` (or `superseded_by:` alone implying
# inactive) orthogonal to `status:`'s epistemic-kind value. Not changed
# now -- this is exactly the kind of schema question the charter asks to
# be recorded rather than silently resolved or silently ignored.

- id: claim.amplitude-accounting-identity-holds-exactly
  status: superseded
  superseded_by: claim.energy-accounting-identity-holds-exactly-at-neutral-tilt
  subject: component.filtered-termination
  relation: guarantees-by-construction
  object: feature.no-double-counted-or-lost-energy-in-the-reflected-
    transmitted-dissipated-split
  conditions: []
  expected_direction: not-applicable (an exact identity, not a magnitude trend)
  confidence: high
  scope: component.filtered-termination
  mechanism: incidentSample-equals-BRIDGE_POLARITY-times-reflectedWave-plus-
    transmittedSignal-plus-dissipated-by-algebraic-construction-not-
    approximation
  possible_confounds: []
  validation:
    method: drive-with-a-mixed-sinusoid-plus-discontinuity-signal-across-a-
      reflection-x-tilt-x-damping-grid-reconstruct-incident-from-the-three-
      outputs-every-sample
    metric: max-absolute-reconstruction-error-across-the-whole-grid
    result: >
      Across reflection in {0, 0.3, 0.6, 1}, reflectionTilt in {-1, -0.5,
      0, 0.5, 1}, terminationDamping in {0, 0.5, 1} (36 combinations, 500
      samples each): max reconstruction error was 1.11e-16 -- floating-
      point epsilon, not an approximation. See
      soundlib/utilities/test/FilteredTermination.test.js's "exact
      amplitude-accounting identity" test.
  superseded_note: >
    Pre-C.5.3 reparameterization explicitly asked for an ENERGY-
    conserving accounting instead (reflected^2+transmitted^2+
    dissipated^2 = incident^2), since the amplitude-domain split above is
    a convenient but non-energy-conserving proxy. An exact linear sum and
    an exact quadratic sum cannot both hold simultaneously for the same
    three-way split (except degenerate cases) -- this claim is kept here,
    marked superseded rather than deleted, as a record of what the
    component used to guarantee and why that guarantee was deliberately
    replaced, not silently dropped.

