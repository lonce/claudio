  subject: component.body-mode-bank
  relation: at-matched-physical-settings-produces
  object: feature.a-longer-audible-decay-tail-than-sparseLowQ
  conditions:
    - identical-reflection-terminationDamping-bodyRadiationGain-
      and-frequency-matched-system-comparison
  status: measured-in-this-model
  expected_direction: increase
  confidence: high
  scope: model_graph.wg3-with-body-c5-1
  mechanism: higher-Q-modes-ring-down-more-slowly-after-excitation-stops-
    per-claim.increasing-modal-q-lengthens-body-mode-decay-so-the-body-s-
    own-isolated-contribution-stays-above-a-fixed-fraction-of-its-own-
    peak-for-longer
  possible_confounds:
    - the-persistence-difference-could-be-an-artifact-of-one-preset-
      simply-being-louder-overall-rather-than-a-genuine-character-
      difference (ruled out directly by also measuring persistence AFTER
      loudness-matching sparseHighQ's contribution to sparseLowQ's own
      RMS -- the persistence gap survives)
  validation:
    method: isolate-each-preset-s-own-additive-body-contribution-matched-
      system-settings-only-bodyPreset-differs-compute-50ms-block-RMS-over-
      a-1.5s-render-find-the-last-block-still-above-10-percent-of-its-own-
      peak-block-repeat-after-loudness-matching-sparseHighQ-to-
      sparseLowQ-s-RMS
    metric: last-block-index-above-10-percent-of-peak-matched-system-and-
      loudness-matched
    result: >
      Matched-system (raw levels, reflection=0.3, terminationDamping=0,
      bodyRadiationGain=50, 220Hz impulse pluck, decayTime=0.3s):
      sparseLowQ's body contribution overall RMS 0.006076, dropping below
      10% of its own peak by the END of the first 50ms block (~50ms
      total). sparseHighQ's body contribution overall RMS 0.001561 (quieter
      overall, a real and reported consequence of Q, not hidden), but
      persisting through block index 2 (~150ms) before dropping below
      10% -- 3x longer. After loudness-matching sparseHighQ's contribution
      up to sparseLowQ's own RMS (scale factor 3.891, measurement-only,
      never fed back into WG3_CONFIG/bodyConfig.js/BodyModeBank.js), the
      persistence advantage survives unchanged (still block index 2,
      ~150ms) -- confirming this is a genuine character difference, not
      a loudness artifact. See wg3Pipeline.test.js's own matched-system/
      loudness-matched test.

