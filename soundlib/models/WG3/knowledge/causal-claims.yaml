- id: claim.gain-compensation-formula-is-exact-not-empirical
  subject: component.body-mode-bank
  relation: implements
  object: feature.an-exact-not-fitted-closed-form-gain-compensation
  conditions: []
  status: confirmed-dsp-property
  expected_direction: not-applicable (an exactness claim, not a trend)
  confidence: high
  scope: component.body-mode-bank
  mechanism: discreteResonatorGainAtCenter()-algebraically-evaluates-
    ResonatorBank-s-own-literal-difference-equation-s-transfer-function-
    at-z-equals-e-to-the-j-theta-not-a-regression-or-curve-fit-against-
    sampled-data
  possible_confounds:
    - a-correct-looking-derivation-could-still-be-wrong-despite-matching-
      a-few-spot-checked-points (addressed by re-validating across the
      FULL C.5.2 range, not just the points already checked during C.5.1)
  validation:
    method: compare-the-formula-s-output-against-direct-time-domain-
      settle-and-measure-simulation-across-every-modal-frequency-used-by-
      every-preset-x-both-supported-sample-rates-44100-and-48000
    metric: worst-case-relative-error-between-formula-and-simulation
    result: >
      Worst relative error across all 4 presets' modes x 2 sample rates
      (32 combinations) was 1.6e-5 (0.0016%), at sparseHighQ's 505Hz mode
      at 44100Hz (formula: 9673.56, simulation: 9673.41). This residual
      is consistent with simulation measurement noise (finite settle
      time, discrete sampling of a continuous sinusoid's true peak), not
      formula error -- confirming the formula is exact, not merely
      accurate in the narrower range C.5.1 happened to check. See
      soundlib/utilities/test/BodyModeBank.test.js's own validation test.

