# ComponentType records for WG2 (WaveguideResonator v1, Phase B).
#
# Pilot scale, per docs/MODEL_PATTERNS.md's digital-waveguide archetype and
# scratch/WaveguideResonator-v1-Specification-and-Reasoning-Model.md
# section 9.1 -- only the NEW components this phase actually built.
# RigidTermination, LoopLossFilter, and InitialConditionExciter (excite())
# are unchanged from soundlib/models/WG1/knowledge/components.yaml;
# InitialConditionExciter gained a second method (exciteAtPosition()),
# noted in its own entry's affordances/limitations rather than duplicating
# the whole record. Likewise, component.linear-interpolator/
# component.allpass1-interpolator/component.lagrange3-interpolator (the
# swappable fractional-delay interpolation strategies BidirectionalWaveguide
# now accepts, same as FractionalDelayWaveguide) are defined once in WG1's
# components.yaml, not duplicated here -- they're soundlib/utilities/
# components shared by both models.

- id: component.bidirectional-waveguide
  name: Bidirectional (Two-Rail) Waveguide
  roles:
    - propagation
  physical_domain: one-dimensional-wave-propagation
  implementation_family:
    - digital-waveguide
  stateful: true
  linear_regime: linear
  energy_behavior: stores-and-circulates
  inputs:
    - boundary-reflection-inputs
  outputs:
    - position-addressable-wave-state
  parameters:
    - parameter.frequency
  preconditions:
    - rail-length-positive
    - rail-length-within-buffer-bounds
  affordances:
    - independently-addressable-spatial-position
    - position-dependent-excitation
    - position-dependent-pickup
    - continuous-live-retuning
    - swappable-fractional-delay-interpolation-strategy (one interpolator
      instance PER RAIL BOUNDARY tap, not shared, since a stateful
      strategy like component.allpass1-interpolator carries persistent
      per-tap state; see soundlib/models/WG1/knowledge/components.yaml
      for the three available strategies -- interpolationMode is a
      construction-time/developer choice, not a user-facing Parameter)
  limitations:
    - each-round-trip-crosses-the-interpolation-tap-twice-once-per-rail
      (vs. FractionalDelayWaveguide's once -- this is why WG2's own
      residual high-frequency energy shortfall under the default
      interpolator, though small, is larger than WG1's; see
      claim.lagrange3-resolves-wg2s-high-frequency-energy-collapse in
      this model's own causal-claims.yaml)
    - terminations-remain-rigid-frequency-independent-boundary-filtering-
      (BridgeTermination) is still unbuilt-future-phase-c-work
  code_ref: soundlib/utilities/BidirectionalWaveguide.js

- id: component.point-pickup
  name: Point Pickup
  roles:
    - pickup
  physical_domain: wave-observation
  implementation_family:
    - traveling-wave-sum-difference
  stateful: false
  linear_regime: linear
  energy_behavior: observes-only-non-invasive
  inputs:
    - bidirectional-waveguide-state
  outputs:
    - observed-sample
  parameters:
    - parameter.pickup-position
    - parameter.pickup-type
  preconditions:
    - pickup-position-within-valid-range
  affordances:
    - displacement-observation
    - velocity-observation-via-traveling-wave-difference
    - bridge-force-observation
  limitations:
    - bridgeForce-ignores-pickupPosition-by-physical-definition
    - no-spatial-averaging-width-yet-point-only
  code_ref: soundlib/utilities/PointPickup.js

- id: component.initial-condition-exciter-position-aware
  name: Initial Condition Exciter (position-aware extension)
  roles:
    - exciter
  physical_domain: energy-injection
  implementation_family:
    - buffer-fill
  stateful: true
  linear_regime: not-applicable
  energy_behavior: injects
  inputs:
    - trigger-event
  outputs:
    - initial-two-rail-state
  parameters:
    - parameter.energy
    - parameter.excitation-type
    - parameter.excitation-position
  preconditions:
    - seeded-random-source-available
    - excitation-position-within-valid-range
  affordances:
    - position-localized-point-excitation-noise-impulse
    - whole-string-shape-excitation-triangle
  limitations:
    - triangle-is-pure-displacement-zero-initial-velocity-no-velocityMix-yet
    - noise-and-impulse-are-single-sample-point-injections-no-width-yet
  code_ref: soundlib/utilities/InitialConditionExciter.js (exciteAtPosition method)

- id: component.dispersion-filter
  name: Dispersion Filter
  roles:
    - dispersion
  physical_domain: frequency-dependent-phase-propagation
  implementation_family:
    - cascaded-first-order-allpass
  stateful: true
  linear_regime: linear
  energy_behavior: approximately-magnitude-preserving
  inputs:
    - sample
    - stiffness (0-1, control-rate)
    - current-fundamental-frequency
  outputs:
    - phase-delayed-sample
    - group-delay-at-f0 (a SEPARATE pure-function output, not part of the
      per-sample signal path -- see "affordances" below)
    - target-description (getTargetDescription(), diagnostic/reporting
      only -- see "internal target description" below)
  parameters:
    - parameter.stiffness
  preconditions:
    - section-coefficient-a1-bounded-away-from-plus-minus-one
  internal_target_description:
    # stiffness maps to { amount, pivot, slope, polarity, pitchLock }, a
    # struct with a slot for each dimension the design directive asked to
    # keep conceptually separate. amount/pivot/slope are ALL live now
    # (pivot/slope exposed as dispersionPivot/dispersionSlope Parameters);
    # polarity/pitchLock stay fixed internal constants. All five are
    # represented in the struct/constructor regardless of which are
    # currently live, so exposing anything further (e.g. negative
    # polarity) is "add a code path," not a restructuring.
    amount: "live -- cents of stretch TARGETED at partial `pivot`, driven by stiffness via amount = amountMaxCents * stiffness^stiffnessCurveExponent. An AUDIBLE quantity, not B directly, per the explicit design goal."
    pivot: "LIVE Parameter (dispersionPivot, range [2,16], default 4) -- a reference/anchor partial, NOT an onset threshold. Renamed from `knee` after direct measurement (see 'pivot vs. knee' below) showed the real achieved curve grows smoothly from partial 1 at every tested value, with no flat 'below-knee' region at any of them -- moving this value rescales where `amount` lands on the same smooth curve, it does not shift a boundary."
    slope: "LIVE Parameter (dispersionSlope, range [0.5,4], default 2) -- the partial-number exponent in the generalized stiff-string relation f_n=n*f0*sqrt((1+B*n^slope)/(1+B)), governing the amount-to-B INVERSION. Confirmed by direct measurement to reshape the achieved curve, not just rescale it (see claim.slope-reshapes-not-just-rescales). A DIFFERENT '2' from the one baked into the Rauhala-Valimaki a1-from-B fit's own internal calibration, which stays fixed regardless of this value -- see 'pivot vs. knee' below for why conflating the two would be a mistake."
    polarity: "fixed 'positive' -- only this value has any code path; see 'Negative dispersion, deferred' below"
    pitchLock: "fixed true -- the only mode implemented; see affordances for how lengthLocked would be added without touching this class"
  pivot_vs_knee:
    # This component's reference-partial parameter was originally named
    # `knee`. Before exposing it permanently, direct measurement was
    # required (not assumed) to confirm whether it actually behaves like
    # a knee (an onset threshold, flat below/rising above) or a moving
    # reference/pivot point.
    finding: >
      It is a pivot, not a knee. Rendering the real filter's achieved
      stretch curve at pivot=[2,4,8,12] (fixed amount=60, slope=2,
      f0=220Hz) showed smooth, continuous growth from partial 1 at EVERY
      tested value -- e.g. at pivot=4, partial 2 (immediately next to the
      fundamental) already shows real stretch (12.3 target / 16.1
      measured cents); at pivot=12, even partial 2 shows a small but
      nonzero effect (1.3/1.7 cents). There is no flat "below-pivot"
      region at any tested value.
    response: >
      Renamed `knee` to `pivot` throughout (this component, WG2's public
      Parameter, all documentation) rather than attempt to build a
      separate true onset-threshold mechanism -- the latter would need a
      fundamentally different (non-power-law) curve shape, a bigger
      change with more design risk, explicitly declined as
      disproportionate to a naming-accuracy problem. A genuine onset-
      threshold knee remains a possible, separate future design -- not
      attempted here. See causal-claims.yaml's
      claim.pivot-is-a-reference-point-not-an-onset-threshold for the
      full measurement.
  affordances:
    - measured-monotonic-controllable-partial-stretching (higher stiffness
      -> higher target amount (cents) -> higher derived B -> more stretch;
      higher partial number -> more stretch at a fixed stiffness -- both
      confirmed by direct measurement, not assumed from the formula alone;
      see claim.stiffness-increases-inharmonicity)
    - widened-creative-range-with-a-measured-not-guessed-ceiling (new
      default AMOUNT_MAX_CENTS=100 at knee=4, ~5x the first step's
      effective ceiling, chosen with margin below the empirically-found
      point where the Rauhala-Valimaki fit's own approximation goes
      unreliable -- see causal-claims.yaml for the full sweep)
    - target-amount-expressed-audibly (cents of stretch at a reference
      partial, not an opaque filter coefficient -- a closed-form
      inversion, B=(R-1)/(pivot^slope-R) with R=2^(amount/600), derives B
      from the requested amount)
    - pivot-and-slope-are-genuine-independent-shape-controls (confirmed by
      direct measurement, not assumed -- at a fixed amount/pivot, varying
      slope changes which B is chosen by over an order of magnitude --
      e.g. at pivot=4/amount=60, slope=1 needs B~0.0245 while slope=3
      needs B~0.00114 -- producing genuinely different achieved curve shapes,
      not a uniform rescale. One caveat worth knowing -- two DIFFERENT
      (pivot,slope) pairs that happen to resolve to the SAME B produce
      IDENTICAL achieved curves (the real filter's behavior depends only
      on B, once chosen) -- pivot/slope are two different ways of
      SELECTING a B, not two independently-expressive axes once B is
      fixed. See causal-claims.yaml's measured grid.)
    - transparent-clamp-reporting (getTargetDescription() reports
      requestedAmount, unclampedB, clampedB, wasClamped, and
      maxRealizableAmount -- the cents value B_SAFE_MAX itself produces
      at the current pivot/slope, computed directly from the forward
      formula. Clamping is never invisible; a caller can tell when
      further stiffness increase has entered a "dead zone" -- confirmed
      by a dedicated regression test, not just documented as a goal)
    - live-pivot-slope-with-smoothing (both are control-rate Parameters,
      smoothed with a one-pole filter -- DISPERSION_SMOOTHING_SECONDS,
      ~30ms starting point -- before use each block; an abrupt
      unsmoothed jump was measured during design to produce a real,
      if modest, sample-level discontinuity (~2-2.5x local baseline
      delta), which this smoothing addresses)
    - bypasses-entirely-at-stiffness-near-zero (process() returns its
      input unchanged, groupDelaySamplesAt() returns 0 -- not merely a
      near-zero coefficient, giving stiffness=0 the cleanest possible
      reference behavior, identical to the component's own absence;
      confirmed byte-identical to omitting stiffness entirely)
    - dispersion-phase-and-tuning-compensation-are-separate-methods
      (process() vs. groupDelaySamplesAt() -- the caller decides whether/
      how to use the compensation value; a future lengthLocked mode
      simply stops using it, without touching this class or process() at
      all -- confirmed working even at the widened range, the pitchLocked
      default keeps the fundamental within ~0.35% from 55Hz-4000Hz at
      stiffness=1, see causal-claims.yaml)
    - cpu-cost-is-modest-and-flat (~1.08-1.09x bypassed at BOTH the
      original and the widened range, measured with 6 sections -- cost
      depends on bypassed-vs-active only, not on amount's magnitude, see
      causal-claims.yaml)
    - requested-vs-achieved-reporting (getTargetDescription() exposes the
      most recently requested target so a caller/test can compare it
      against what it independently measures was actually achieved --
      the directive's own explicit request; this class has no notion of
      "partials" itself, so measurement is always the caller's job)
  limitations:
    - sectionCount-fixed-at-construction-not-yet-a-parameter (M=6 for
      WG2, chosen as a starting point within the source paper's own
      "8 typical, keep below 20" range, not re-derived from first
      principles)
    - slope-is-live-but-its-INTERACTION-with-the-fixed-a1-fit-is-subtle
      (slope governs the amount-to-B INVERSION -- which B gets chosen --
      and this is confirmed safe/meaningful to vary. What remains fixed
      is a DIFFERENT exponent, baked into the Rauhala-Valimaki a1-from-B
      empirical fit's own internal calibration, assumed to be 2
      regardless of the live `slope` value. These are not the same "2,"
      and conflating them would be a mistake -- see pivot_vs_knee above
      and DispersionFilter.js's own `update()` comment)
    - B-safety-protects-TUNING-specifically-not-stretch-accuracy-beyond-
      pivot (DISPERSION_B_SAFE_MAX=0.05 is "the current limit of reliable
      pitch compensation, not a stability or final expressive limit" --
      large B stays finite/stable/correctly-ordered far beyond this
      (tested to B=0.2). It does NOT protect stretch accuracy at partials
      BEYOND the pivot itself, which has its own, separate, lower,
      per-partial breakdown points -- e.g. at pivot=2/amount=60 (B=0.0245,
      well under the 0.05 tuning clamp), partial 4's own measured stretch
      is already unreliable (-182 vs the +265 target cents). Two
      different limitations, not conflated into one clamp -- see
      causal-claims.yaml)
    - filter-approximation-limits-found-empirically-not-assumed (sweeping
      B far beyond the chosen ceiling -- fundamental TUNING (in CENTS, not
      just percent) stays under ~1 cent from 55-880Hz through B=0.05,
      growing to ~10.6 cents at 1760Hz at that same B (right at the
      stated 10-cent tolerance, reported honestly) -- but the partial-4
      STRETCH MEASUREMENT ITSELF goes non-monotonic and unreliable well
      before B=0.05, consistent across 110/220/440/880Hz. The new ceiling
      (AMOUNT_MAX_CENTS=100, B~0.0082 at defaults) sits with margin below
      both breakdown points -- see causal-claims.yaml for the full
      sweep table, including the corrected frequency-adaptive measurement
      method (a fixed 4096-sample window gives misleading, noisy cents
      figures at low f0, found and fixed during this step's own planning)
    - requested-amount-increasingly-UNDERSTATES-achieved-stretch-as-B-
      grows (the idealized continuous formula and the REAL 6-section
      cascade's actual behavior diverge increasingly as B grows -- even
      well before the hard breakdown point, measured achieved stretch
      runs higher than the theoretical target. The requested `amount` is
      a useful, monotonic control dial, not a precise promise of exactly
      that many cents)
    - pre-existing-low-frequency-domain-limitation-NOT-introduced-by-this-
      widening (the Rauhala-Valimaki fit's own "Ikey" piano-key-index
      term is calibrated for f0 >= A0 = 27.5Hz; below that it
      extrapolates badly. Confirmed this ALREADY happened at the
      first step's much smaller B_MAX too -- not something the wider
      range caused. Never caught before because the first step's own
      tuning-accuracy test only used f0=220Hz; now tested explicitly, see
      causal-claims.yaml)
    - absolute-T60-grows-somewhat-with-stiffness (a real, measured side
      effect -- at decayTime=0.5, T60 measured ~3.03s at stiffness=0 vs.
      ~4.21s at stiffness=1, ~39% longer -- the near-unity-magnitude
      allpass cascade isn't perfectly magnitude-neutral in practice. The
      RATIO between two decayTime settings stays independent of
      stiffness, which is what's actually asserted in
      wg2Pipeline.test.js; the absolute-value side effect is reported,
      not hidden, not asserted against)
    - applied-ONCE-per-round-trip-at-the-bridge-boundary-only-not-split-
      across-both-boundaries (a deliberate v1 simplification matching the
      source paper's own single-lumped-loop insertion point, not an
      unverified half-split the way LoopLossFilter's scalar coefficient
      exactly and losslessly splits -- see docs/MODEL_PATTERNS.md's Phase
      C subsection)
    - no-lengthLocked-mode-exposed-yet (the architecture supports it --
      see affordances above -- but only pitchLocked is wired up)
    - no-negative-dispersion-yet (polarity is fixed 'positive'; no code
      path exists for a negative/synthetic-compression branch -- see
      "Negative dispersion, deferred" below)
    - no-brightnessDecay-yet (frequency-dependent LOSS, as distinct from
      this component's frequency-dependent PHASE, remains future
      Phase C work -- LoopLossFilter is still broadband-only)
  future_affordances:
    # Explicitly recorded per the design directive's own instruction --
    # these are NOT yet implemented, just designed to not require
    # restructuring this component when they are. dispersionPivot and
    # dispersionSlope, previously listed here, are now both live -- see
    # internal_target_description above.
    - a-true-onset-threshold-knee -- a genuinely different curve shape
      (not the current power-law) with an actual flat-then-rising
      region, separate from the pivot/reference-point concept this
      component now implements. Would need its own design and
      validation, not a parameter addition to this component.
    - direct-phase-based-tuning-compensation -- RECORDED, not
      investigated, per explicit instruction -- a bounded numerical solve
      choosing the base delay so total round-trip phase (delay +
      interpolation + dispersion + termination) at the requested
      fundamental equals the required multiple of 2*pi, as a possible way
      to extend the reliable pitchLocked range beyond
      DISPERSION_B_SAFE_MAX's current empirical-formula-derived ceiling.
      Not pursued in this step; noted so it isn't lost.
    - lengthLocked -- an alternative to the current pitchLocked default,
      would simply stop subtracting groupDelaySamplesAt()'s result from
      the rail length in wg2Processor.js, letting the fundamental itself
      move as stiffness changes while the geometric string length stays
      fixed -- no change to DispersionFilter itself
    - negative/synthetic dispersion -- per the design directive, explicitly
      NOT "pass a negative B into the same formula" -- would need its own
      bounded target curve and validation, represented as a genuinely
      different `polarity` value and code path, not a sign flip of the
      existing positive-stiffness math. The struct already has a
      `polarity` slot so this doesn't require restructuring the target
      description itself, only adding the new branch
  grounding:
    # Per docs/MODEL_PATTERNS.md's "grounding a physically-informed model
    # in real data" discipline -- distinguishing sourced fact from
    # informed construction within this one component.
    physical: >
      The allpass-coefficient derivation (a1 from B, f0, sampleRate, and
      sectionCount) is the real closed-form method of Rauhala & Valimaki,
      "Dispersion Modeling in Waveguide Piano Synthesis Using Tunable
      Allpass Filters" (DAFX-2006, pp. 71-76), as implemented in Faust's
      standard library (misceffects.lib's piano_dispersion_filter,
      authored by Julius O. Smith III) -- verified against the real
      source at
      https://github.com/grame-cncm/faustlibraries/blob/master/misceffects.lib,
      not transcribed from a secondary summary. The amount-to-B inversion
      (B=(R-1)/(pivot^slope-R), R=2^(amount/600)) is a closed-form
      algebraic inversion of the SAME textbook stiff-string relation this
      fit targets, not a new physical claim.
    physically_informed: >
      The stiffness-to-amount mapping (amount = amountMaxCents *
      stiffness^stiffnessCurveExponent in DispersionFilter.js) preserves
      the correct causal direction but the specific curve shape is a
      judgment call. The CEILING (amountMaxCents=100, and separately
      DISPERSION_B_SAFE_MAX=0.05) is not purely a judgment call, though --
      both were calibrated empirically against where the Rauhala-Valimaki
      fit's own approximation stays reliable (tuning for B_SAFE_MAX,
      per-partial stretch accuracy for amountMaxCents -- see limitations
      above and causal-claims.yaml's sweeps), a harder constraint than
      aesthetic preference alone would have given. pivot's default of 4
      (not 8, used for the first widening step's own headline numbers) is
      similarly a measured choice: partial 8 breaks down earlier than
      partial 4 under the same B, so anchoring `amount` at a lower
      partial leaves more usable headroom. pivot and slope's live RANGES
      ([2,16] and [0.5,4] respectively) are chosen with margin from the
      inversion's own denominator-degenerate edge case (pivot^slope must
      stay comfortably above R's maximum, ~1.122 at the current amount
      ceiling) -- not from any stability concern, since large B itself
      stays stable/finite/ordered well beyond any value reachable within
      these ranges.
  code_ref: soundlib/utilities/DispersionFilter.js
