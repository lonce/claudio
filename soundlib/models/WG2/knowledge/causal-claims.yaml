# CausalClaim records for WG2 (WaveguideResonator v1, Phase B).
#
# Every claim here is backed by an actual measurement from
# soundlib/models/WG2/wg2PipelineCore.js (via soundlib/utilities/test/
# wg2Pipeline.test.js and the scratch verification that preceded it), not
# asserted from physical intuition alone -- same discipline as
# soundlib/models/WG1/knowledge/causal-claims.yaml. frequency/energy/
# decayTime's basic behavior is unchanged from WG1's own record; the
# claims below are specific to what Phase B actually added.

- id: claim.excitation-position-creates-movable-modal-nulls
  subject: parameter.excitation-position
  relation: moving-toward-a-harmonics-node-tends-to-cause
  object: feature.suppressed-strength-of-that-harmonic
  conditions:
    - two-rail-bidirectional-waveguide
  expected_direction: suppress-at-node-present-elsewhere
  confidence: high
  scope: component.bidirectional-waveguide
  mechanism: pluck-at-a-position-cannot-excite-a-harmonic-whose-modal-shape-is-zero-there
  possible_confounds:
    - pickup-position-could-independently-null-the-same-harmonic (controlled for in validation by fixing pickup position while varying excitation position)
  validation:
    method: pluck-at-string-midpoint-vs-off-center-then-measure-per-harmonic-magnitude-via-single-bin-dft
    metric: even-harmonic-magnitude-ratio-midpoint-vs-off-center
    result: >
      At frequency=220Hz, pickupPosition fixed at 0.31: exciting at the
      midpoint (0.5) suppressed harmonics 2/4/6/8 by ratios of
      0.008/0.012/0.050/0.008 relative to exciting at 0.18 (off-center) --
      i.e. 20x-125x quieter. Odd harmonics 1/3/5/7 were NOT systematically
      suppressed under the same comparison (ratios 1.0-3.4x, noise-level
      variation, not a suppression pattern). This is the classic, textbook-
      predicted plucked-string modal-null behavior (a string plucked
      exactly at its midpoint cannot excite any even harmonic, since their
      mode shapes are zero there) -- measured directly, not assumed to
      follow from the DSP structure.

- id: claim.pickup-position-creates-movable-modal-nulls
  subject: parameter.pickup-position
  relation: moving-toward-a-harmonics-node-tends-to-cause
  object: feature.suppressed-strength-of-that-harmonic
  conditions:
    - two-rail-bidirectional-waveguide
  expected_direction: suppress-at-node-present-elsewhere
  confidence: high
  scope: component.point-pickup
  mechanism: observing-at-a-position-cannot-detect-a-harmonic-whose-modal-shape-is-zero-there
  possible_confounds:
    - excitation-position-could-independently-null-the-same-harmonic (controlled for in validation by fixing excitation position while varying pickup position)
  validation:
    method: fix-excitation-off-center-vary-pickup-position-then-measure-per-harmonic-magnitude
    metric: even-harmonic-magnitude-ratio-midpoint-vs-off-center
    result: >
      At frequency=220Hz, excitationPosition fixed at 0.18: observing at
      the midpoint (0.5) suppressed harmonics 2/4/6/8 by ratios of
      0.003/0.007/0.015/0.006 relative to observing at 0.29 (off-center) --
      60x-330x quieter. Confirms the null is genuinely a property of
      *where you observe*, independent of the excitation-position claim
      above, not just a restatement of it.

- id: claim.two-rail-structure-shortens-decay-more-than-single-loop
  subject: component.bidirectional-waveguide
  relation: increasing-tends-to-cause
  object: feature.shorter-than-WG1s-nominal-fundamental-decay-shortfall
  conditions:
    - static-frequency
    - linear-interpolation-still-in-use (HISTORICAL -- linear was the only
      interpolator when this claim was first written; lagrange3 is the
      default as of the interpolation-strategy investigation, see
      claim.lagrange3-resolves-wg2s-high-frequency-energy-collapse below.
      Kept because it's still an accurate description of the two-rail
      structure's effect specifically under linear interpolation, and
      it's the finding a rigorous follow-up critique demanded be properly
      isolated -- see that claim for the full isolation.)
  expected_direction: decrease
  confidence: high
  scope: component.bidirectional-waveguide
  mechanism: each-full-round-trip-now-crosses-two-separate-fractional-interpolation-taps-instead-of-one
  possible_confounds:
    - specific-frequency-tested-fractional-part-of-rail-length-not-swept-exhaustively (RESOLVED -- see claim.lagrange3-resolves-wg2s-high-frequency-energy-collapse's frequency-swept isolation, which supersedes this)
  validation:
    method: compare-measured-T60-to-analytical-prediction-at-frequency-220Hz
    metric: measured-T60-to-analytically-predicted-T60-ratio
    result: >
      At frequency=220Hz: decayTime=0.5s measured ratio 0.780, decayTime=2s
      measured ratio 0.670 -- both somewhat below WG1's own worst-case
      ~0.75 at the same frequency, consistent with (not proof of) the
      two-taps-per-trip mechanism. This was originally recorded at
      confidence "medium" pending a proper isolation with an exact-
      integer-railLength control and internal-energy (not just pickup)
      measurement, exactly as a subsequent rigorous critique demanded --
      that isolation was carried out (see the next claim) and raised this
      to "high": at MODERATE frequencies (up to ~440Hz) the fundamental-
      band decay shortfall for WG2 is close to WG1's own (0.975 vs 0.96 at
      220Hz, band-specific Goertzel measurement, not broadband RMS) --
      the two-rail structure's OWN contribution to fundamental-decay
      shortfall, independent of the interpolator-collapse effect, is
      small. The dramatic, topology-dependent divergence from WG1 is
      concentrated at HIGH frequencies and is a broadband/internal-energy
      effect, not primarily a fundamental-decay effect -- see next claim.

- id: claim.lagrange3-resolves-wg2s-high-frequency-energy-collapse
  subject: component.lagrange-interpolator
  relation: replacing-linear-with-tends-to-cause
  object: feature.wg2-internal-energy-preserved-across-most-of-the-supported-frequency-range
  conditions: []
  expected_direction: increase
  confidence: high
  scope: component.bidirectional-waveguide
  mechanism: >
    WG2's round trip crosses a fractional-delay interpolation tap TWICE
    (once per rail boundary), vs. WG1's once -- so any per-crossing
    magnitude rolloff compounds harder in WG2 than WG1. Swapping in an
    interpolator with a much gentler high-frequency rolloff (lagrange3,
    a 4-point/3rd-order FIR polynomial interpolator, vs. linear's 2-point
    straight-line fit) reduces each individual crossing's loss, so the
    doubled-crossing structure no longer compounds into a collapse.
  possible_confounds:
    - explicit-loss-filter-coefficient-bug (RULED OUT -- isolated with
      explicit loss disabled, decayTime forced near-infinite)
    - pickup-position-phase-cancellation (RULED OUT -- measured via
      internal stored energy, sum of squares across BOTH rail buffers,
      not just the pickup output)
  validation:
    method: >
      Same near-lossless internal-energy isolation technique as WG1's own
      claim.linear-interpolation-collapses-at-high-frequency, swept across
      55-3000Hz, compared for linear vs. lagrange3 (and vs. allpass1,
      which was evaluated and rejected on tuning/transient-stability
      grounds -- see WG1's own causal-claims.yaml for the full 3-way
      comparison; WG2-specific numbers recorded here).
    metric: internal-energy-T60-as-fraction-of-analytical-prediction-or-not-reached
    result: >
      Under linear interpolation, WG2 tracked WG1 closely below ~440Hz but
      collapsed to ~0.06/0.02 of nominal at 1760/3000Hz (vs. WG1's own
      roughly-constant ~0.72-0.77 across the whole range) -- confirming
      the doubled-crossing mechanism, not a WG2-specific bug. Under
      lagrange3, internal energy is fully preserved (T60 "not reached"
      within the render) at every tested frequency except the very top of
      the range: at 3000Hz, measured internal-energy T60 was ~1.4s rather
      than "not reached" -- a ~24x improvement over linear's ~0.058s
      there, but not a complete fix, and honestly recorded as a residual
      rather than claimed as fully solved. This matches the general
      pattern (WG2's doubled crossings make it the harder case, so a
      residual that's negligible for WG1 remains measurable, if greatly
      reduced, for WG2). Fundamental-band T60 accuracy across the same
      sweep stayed close to nominal at every frequency from 55-1760Hz,
      with a similarly weaker (but non-catastrophic) result at 3000Hz --
      see soundlib/utilities/test/wg2Pipeline.test.js's per-frequency
      threshold table for the exact measured ratios this claim is backed
      by. lagrange3 was selected as WG2's (and WG1's) shared default
      interpolator on this evidence -- see
      soundlib/utilities/createInterpolator.js.

- id: claim.pickup-type-changes-observed-signal-character
  subject: parameter.pickup-type
  relation: changing-value-tends-to-cause
  object: feature.distinctly-different-waveform
  conditions: []
  expected_direction: change
  confidence: high
  scope: component.point-pickup
  mechanism: displacement-is-rail-sum-velocity-is-rail-difference-bridgeForce-is-raw-pre-reflection-bridge-sample
  possible_confounds: []
  validation:
    method: render-same-pluck-under-each-pickup-type-compare-sample-by-sample
    metric: exact-non-equality-of-rendered-sample-arrays
    result: >
      At frequency=220Hz, pickupPosition=0.3: displacement, velocity, and
      bridgeForce each produced a distinct sample array (no two equal).
      displacement and velocity had similar RMS (0.0147 vs 0.0147);
      bridgeForce measurably lower (0.0104) -- expected, since it taps a
      single rail's raw pre-reflection value rather than a sum/difference
      of both.

- id: claim.stiffness-increases-inharmonicity
  subject: parameter.stiffness
  relation: increasing-tends-to-cause
  object: feature.partial-inharmonicity
  conditions:
    - dispersion-filter-enabled (i.e. stiffness above the bypass epsilon)
  expected_direction: increase
  confidence: high
  scope: component.dispersion-filter
  mechanism: frequency-dependent-phase-delay-from-a-cascade-of-first-order-allpass-sections
  possible_confounds:
    - coupled-resonators (not applicable here -- WG2 has no coupled
      second polarization yet)
    - interpolation-residual-phase-error (RULED OUT as the source of this
      effect specifically -- see "Distinguishing dispersion from
      interpolation residuals," below; stiffness=0's own measured tuning
      error matches the pre-existing, already-documented lagrange3
      baseline exactly, confirming this claim's effect is additional to,
      not a restatement of, that baseline)
    - analysis-resolution (the peak-search method's own frequency grid
      has finite resolution -- mitigated by using a dense 400-point
      search per measurement, not a fixed FFT bin)
  validation:
    method: partial-tracking-sweep (direct extension of this project's
      "measure, don't assume" discipline to the spec's own suggested
      CausalClaim validation method, section 9.2)
    metric: measured-partial-frequency-vs-nominal-n-times-f0
    result: >
      ORIGINAL (first dispersion step, knee=8 reference, superseded):
      at frequency=220Hz, partial 8 increased monotonically across
      stiffness=[0, 0.25, 0.5, 0.75, 1.0] from 1760.55Hz to 1837.55Hz
      (~77.5Hz stretch at stiffness=1) and matched the textbook target
      curve within 0.6%.

      WIDENED RANGE (current): the target description was restructured
      to { amount, knee, slope, polarity, pitchLock }, with amount
      (cents of stretch at knee=4) now the live quantity driven by
      stiffness via a steep power curve (amount = 100 * stiffness^3),
      replacing the old direct stiffness->B mapping. At frequency=220Hz,
      excitationPosition=0.15, pickupPosition=0.37, partial 4's measured
      frequency increased monotonically across stiffness=[0, 0.25, 0.5,
      0.75, 1.0]: 880.00, 881.03, 886.93, 905.15, 950.58 Hz (~70.6Hz /
      ~136 cents stretch at stiffness=1 -- a ~6x increase in cents over
      the first step's own knee=8 equivalent, directly satisfying "a
      substantially more extreme and clearly audible" maximum). At a
      fixed stiffness=1.0, stretch increased with partial number: partial
      2 ~28Hz, partial 4 ~70.6Hz, partial 8 ~76Hz -- the ordering holds,
      though partial 8's own measured value is noticeably less clean/
      reliable than partial 4's (expected -- see
      claim.dispersion-filter-approximation-limits below for exactly why
      knee=4, not 8, was chosen as the live reference point). Partial
      ordering (p2<p4<p8) was independently confirmed preserved across
      the full stiffness range at f0=220Hz.

- id: claim.pitchlocked-compensation-keeps-fundamental-in-tune-across-stiffness
  subject: component.dispersion-filter
  relation: subtracting-groupDelaySamplesAt-from-rail-length-tends-to-cause
  object: feature.fundamental-frequency-stable-across-stiffness
  conditions:
    - pitchLocked-mode (the only mode implemented -- see
      components.yaml's future_affordances for lengthLocked)
  expected_direction: stable (near-zero additional drift as stiffness
    increases)
  confidence: high
  scope: component.dispersion-filter
  mechanism: >
    DispersionFilter.groupDelaySamplesAt(f0, sampleRate) returns the
    whole M-section cascade's own group delay at the fundamental, for the
    filter's current stiffness state; wg2Processor.js subtracts this from
    the geometric rail length each block, so total loop delay at f0
    (geometric + dispersion-filter-contributed) stays matched to the
    requested period regardless of how much extra phase the dispersion
    filter itself is adding.
  possible_confounds:
    - sign-convention-error-in-the-compensation-formula (a REAL risk
      flagged during implementation -- the source paper's own Faust
      reference exposes a pre-negated output tailored to ITS pipeline's
      own +(totalDelay) usage; DispersionFilter.js's groupDelaySamplesAt()
      deliberately uses a different, plain-positive convention matching
      its own name and this model's own subtraction usage. Confirmed
      correct by direct measurement on the FIRST implementation attempt,
      not assumed -- see validation.)
  validation:
    method: autocorrelation-style-peak-search-at-the-fundamental-across-a-stiffness-sweep
    metric: percent-error-vs-requested-frequency
    result: >
      ORIGINAL (first dispersion step): at frequency=220Hz, across
      stiffness=[0, 0.1, 0.25, 0.5, 0.75, 1.0], measured fundamental
      stayed within ~0.08% of 220Hz at every step -- confirming the
      compensation sign convention and formula are correct, not merely
      in the source paper.

      WIDENED RANGE (current): re-verified at stiffness=1 (the hardest
      case) across the FULL mid/usable frequency range, not just 220Hz --
      measured error stayed under 0.35% from 55Hz through 4000Hz (and
      exactly 0.00% at 220/440/880/1760/3000/4000Hz). The compensation
      continues to work correctly at the new, much larger amount ceiling,
      confirming the pitchLocked architecture generalizes beyond the
      narrow range it was first validated against. See
      claim.dispersion-pre-existing-low-frequency-tuning-limitation below
      for the one real exception (f0 near/below A0=27.5Hz), which is NOT
      part of this claim's scope -- it is a separate, pre-existing
      limitation of the underlying empirical fit, not a failure of the
      compensation architecture itself.

- id: claim.dispersion-filter-approximation-limits
  subject: component.dispersion-filter
  relation: increasing-B-beyond-a-measured-point-tends-to-cause
  object: feature.unreliable-partial-stretch-measurement
  conditions:
    - B-pushed-beyond-approximately-0.009-to-0.0105
  expected_direction: degrade (non-monotonic, eventually sign-flipped/implausible)
  confidence: high
  scope: component.dispersion-filter
  mechanism: >
    The Rauhala-Valimaki empirical fit (the k1..k3/m1..m4 constants in
    DispersionFilter.js) was calibrated against real, comparatively small
    piano-string B values. Pushed far outside that calibrated domain, the
    fit's own a1-from-B derivation stops reliably producing the intended
    target curve, independent of whether the resulting a1 itself remains
    numerically stable (it does, bounded to [-0.999,0.999] by
    construction).
  possible_confounds:
    - peak-search-measurement-error (RULED OUT as the primary cause --
      narrowing the search window to stay safely within inter-partial
      spacing, and cross-checking fundamental tuning separately via the
      SAME render, shows fundamental tuning stays accurate (<1% error)
      far past the point where the stretch measurement itself goes
      unreliable -- the breakdown is in what the filter actually produces
      at the targeted partial, not in how it's measured)
  validation:
    method: >
      Direct B sweep (bypassing stiffness entirely, driving a1 from B
      directly) at f0=[110, 220, 440, 880]Hz, B from 0.001 to 4.0,
      tracking partial 4's measured position alongside fundamental tuning
      error.
    metric: measured-partial-position-monotonicity-and-plausibility
    result: >
      Fundamental tuning stays accurate (<1% error) up to B~0.03-0.04.
      Partial 4's own measured position, however, grows monotonically and
      plausibly only up to B~0.009-0.0105 (p4 cents ~13 at B=0.001 to
      ~140-155 at B~0.0085-0.0105, consistent across 110-440Hz), then
      becomes non-monotonic (small dips/wobbles starting ~B=0.009-0.0105)
      and finally clearly breaks (sign-flipped, implausible values) above
      B~0.011-0.0115 -- consistently across all four tested frequencies.
      This is the real ceiling for this component, NOT a tuning-accuracy
      or stability one. DISPERSION_AMOUNT_MAX_CENTS=100 at knee=4 (see
      wg2Config.js) inverts to B~0.0082 -- chosen specifically to sit
      with margin below this measured breakdown zone, not at or past it.
      A secondary, related finding: even well before the hard breakdown,
      measured achieved stretch increasingly OVERSHOOTS the idealized
      theoretical target as B grows (e.g. at B=0.02, measured partial-2
      stretch ran ~1.8x the theoretical prediction) -- the requested
      `amount` is a useful, monotonic creative dial, not a precise cents
      promise, and this is recorded as a limitation, not hidden.

- id: claim.dispersion-pre-existing-low-frequency-tuning-limitation
  subject: component.dispersion-filter
  relation: operating-near-or-below-A0-tends-to-cause
  object: feature.degraded-fundamental-tuning-accuracy
  conditions:
    - f0-near-or-below-27.5Hz (A0, the lowest piano key)
  expected_direction: degrade
  confidence: medium
  scope: component.dispersion-filter
  mechanism: >
    The Rauhala-Valimaki fit's own "Ikey" piano-key-index term
    (logBase(semitoneRatio, f0*semitoneRatio/A0Hz) in DispersionFilter.js)
    is calibrated against real piano keys, A0=27.5Hz and up. Below that,
    Ikey goes negative and the empirical fit extrapolates outside its
    calibrated domain.
  possible_confounds:
    - introduced-by-the-widened-range (RULED OUT -- confirmed this
      ALREADY happened at the first dispersion step's much smaller
      B_MAX=0.0015 too, via an isolated direct-B check at f0=20Hz, so
      this pre-dates and is independent of the amount-widening work)
  validation:
    method: fundamental-tuning-measurement-at-the-low-frequency-edge,-both-the-old-and-new-B-range
    metric: percent-error-vs-requested-frequency
    result: >
      At the new widened range (stiffness=1, B~0.0082, via the real
      end-to-end pipeline): f0=20Hz measured ~7.8% tuning error, f0=30Hz
      ~5.0%, f0=55Hz and above under 0.4%. A separate, isolated check at
      the OLD B_MAX=0.0015 (driving a1 from B directly, bypassing
      stiffness) measured a larger ~34% error at f0=20Hz -- confirming
      this is not new, though the two measurements used different test
      harnesses and aren't directly comparable in magnitude, hence
      `confidence: medium` rather than `high`. NOT fixed in this pass --
      a different, nontrivial problem (the empirical fit's own calibrated
      domain) from the amount-widening this step's work was scoped to.
      Flagged to the user as a discovered, separate issue. Tested
      explicitly (not excluded from the sweep) in
      wg2Pipeline.test.js with a deliberately loose bound, specifically so
      a future change that makes this meaningfully worse gets caught.

# --- Distinguishing dispersion, damping, interpolation residuals, and
# the stiffness mapping (per the design directive's own explicit request
# to record this distinction) ---
#
# dispersion / dispersionAmount (this file's claim.stiffness-increases-
#   inharmonicity and claim.pitchlocked-compensation-keeps-fundamental-
#   in-tune-across-stiffness, component.dispersion-filter): frequency-
#   dependent PROPAGATION TIME/PHASE, intentionally introduced, zero at
#   stiffness=0 (the filter bypasses entirely, not just a small
#   coefficient). `dispersionAmount` is the more general magnitude/
#   direction concept `stiffness` maps onto -- positive-only for now (see
#   components.yaml's future_affordances for the deferred negative/
#   synthetic-compression direction).
#
# dispersionPivot / dispersionSlope (component.dispersion-filter's
#   internal_target_description, components.yaml) -- renamed from
#   dispersionKnee after direct measurement (see
#   claim.pivot-is-a-reference-point-not-an-onset-threshold) showed it
#   behaves as a moving reference/anchor point, not an onset threshold:
#   WHERE (pivot, the reference partial amount is anchored at -- live,
#   default 4) `amount` is measured, and HOW FAST (slope, the partial-
#   number exponent -- live, default 2) the curve grows through the
#   partial series. BOTH are now live Parameters, confirmed by direct
#   measurement to each produce genuinely different achieved curves (see
#   claim.slope-reshapes-not-just-rescales), not three correlated ways of
#   adjusting one overall inharmonicity knob. `slope` here must not be
#   confused with the Rauhala-Valimaki a1-from-B fit's OWN separate,
#   still-fixed internal calibration exponent -- see
#   components.yaml's pivot_vs_knee note.
#
# filter approximation limits (claim.dispersion-filter-approximation-
#   limits): the measured, growing divergence between requested amount
#   (cents) and actually-achieved stretch as B grows, and the real
#   ceiling this imposes -- found by direct measurement, not assumed from
#   the closed-form formula's own idealized prediction. Two SEPARATE
#   limitations live under this heading, not one: B_SAFE_MAX protects
#   fundamental TUNING specifically (see
#   claim.b-safe-max-characterized-in-cents); per-partial breakdown
#   points protect stretch accuracy AT partials beyond the pivot, and are
#   unrelated to whether tuning itself stays accurate.
#
# damping (component.loop-loss-filter, soundlib/models/WG1/knowledge/
#   causal-claims.yaml's claim.decay-time-lengthens-decay): frequency-
#   independent (still broadband-only -- brightnessDecay, a frequency-
#   dependent loss control, remains unbuilt future Phase C work) MAGNITUDE
#   loss, controlled by decayTime, orthogonal to stiffness -- confirmed
#   independent by direct measurement (decayTime's T60-scaling ratio
#   stayed consistent, ~3.9-4.0x, across stiffness=0/0.5/1.0 even at the
#   widened range, in wg2Pipeline.test.js). One honest caveat: ABSOLUTE
#   T60 at a fixed decayTime does grow somewhat with stiffness (measured
#   ~3.03s -> ~4.21s at decayTime=0.5, stiffness=0 to 1, ~39% longer) --
#   the near-unity-magnitude allpass cascade isn't perfectly magnitude-
#   neutral in practice. This is a real, reported side effect, not
#   asserted against by any test, and distinct from the RATIO independence
#   that IS asserted.
#
# interpolation residuals (component.lagrange-interpolator, this file's
#   claim.lagrange3-resolves-wg2s-high-frequency-energy-collapse and
#   claim.two-rail-structure-shortens-decay-more-than-single-loop above):
#   UNINTENTIONAL numerical phase/magnitude error from the delay-line
#   implementation itself, present even at stiffness=0 -- already
#   measured and documented as its own, separate, pre-existing baseline
#   BEFORE this dispersion work began. stiffness=0's own measured tuning
#   error (claim.pitchlocked-compensation-keeps-fundamental-in-tune-
#   across-stiffness's own stiffness=0 data point, ~0.08%) matches this
#   pre-existing baseline, confirming the two effects are not conflated:
#   the dispersion filter adds a NEW, deliberate, measured effect on top
#   of an unchanged numerical baseline, not a rebranding of the same
#   residual. The LOW-FREQUENCY limitation (claim.dispersion-pre-existing-
#   low-frequency-tuning-limitation) is a THIRD, separate category again --
#   not an interpolation residual at all, but the dispersion filter's own
#   empirical fit extrapolating outside its calibrated domain.
#
# stiffness (parameter.stiffness): the public, positive, physically-
#   motivated MACRO control -- retained as the PRIMARY control, per
#   explicit instruction, even though dispersionPivot/dispersionSlope are
#   now also live. Maps onto `dispersionAmount` (above) via a steep power
#   curve (amount = amountMaxCents * stiffness^stiffnessCurveExponent)
#   chosen so the lower part of the range keeps fine control over
#   plausible string stiffness while the upper part explores strongly
#   inharmonic, physically-inspired-but-not-physical territory -- see
#   components.yaml's "grounding" field for exactly which part of the
#   full mapping chain (stiffness->amount->pivot/slope->B->a1) is
#   physical vs. physically informed.

- id: claim.pivot-is-a-reference-point-not-an-onset-threshold
  subject: parameter.dispersion-pivot
  relation: renaming-from-knee-to-pivot-is-justified-by
  object: feature.measured-smooth-continuous-stretch-curve
  conditions: []
  expected_direction: not-applicable (a semantic/naming finding, not a magnitude claim)
  confidence: high
  scope: component.dispersion-filter
  mechanism: >
    The real filter's achieved stretch curve, for any fixed B, grows
    smoothly and continuously from partial 1 -- there is no flat region
    at low partial numbers followed by a rise at some threshold. Moving
    the reference-partial parameter changes which B gets chosen (via the
    amount-anchoring inversion), which rescales the WHOLE curve; it does
    not introduce or shift an onset boundary, because the underlying
    power-law curve shape has none.
  possible_confounds:
    - the-real-filter-could-diverge-from-the-idealized-formula-in-a-way-
      that-creates-an-apparent-knee (RULED OUT by measuring the REAL
      filter's output directly, not just the idealized continuous
      formula -- both show the same smooth, continuous growth from n=1)
  validation:
    method: >
      Rendered the real filter's achieved stretch (target AND measured
      cents) at partials [1,2,3,4,6,8,12,16] for reference-partial values
      [2,4,8,12], fixed amount=60, slope=2, f0=220Hz.
    metric: cents-stretch-at-each-partial-vs-reference-partial-value
    result: >
      At reference=4: partial 2 already shows 12.3 target/16.1 measured
      cents (not ~0, as a true onset threshold below the reference would
      predict). At reference=12: even partial 2 shows a small but
      nonzero 1.3/1.7 cents. At reference=2 (the lowest tested): partial
      3 already shows 151.6 target/216.7 measured cents. No tested value
      showed a flat region below itself. This directly supports renaming
      `knee`->`pivot` (the chosen, bounded response) over building a
      separate true onset-threshold mechanism (a larger, declined scope
      for this step) -- see components.yaml's pivot_vs_knee field for the
      full writeup.

- id: claim.slope-reshapes-not-just-rescales
  subject: parameter.dispersion-slope
  relation: increasing-tends-to-cause
  object: feature.steeper-upper-partial-concentration
  conditions:
    - fixed-pivot-and-amount
  expected_direction: increase (stretch concentrates more at higher partials as slope increases)
  confidence: high
  scope: component.dispersion-filter
  mechanism: >
    slope is the partial-number exponent in the amount-to-B inversion
    (B=(R-1)/(pivot^slope-R)). At a fixed pivot and amount, a higher
    slope means a SMALLER B is needed to hit the same target at the
    pivot (since pivot^slope grows with slope) -- and a smaller B
    concentrates relatively more of the curve's total stretch onto
    partials above the pivot, less below.
  possible_confounds:
    - slope-might-just-be-another-way-to-scale-B-redundant-with-amount
      (the directive's own explicit concern -- CHECKED directly, the
      RATIO of stretch at different partials, not just the overall
      magnitude, changes substantially across slope values, which a pure
      magnitude/amount-redundant control would not do)
  validation:
    method: idealized-curve-ratio-comparison-at-fixed-pivot-and-amount,-cross-checked-against-the-real-filter
    metric: ratio-of-stretch-at-high-vs-low-partials
    result: >
      At pivot=4, amount=60 (idealized formula): the ratio of partial-16-
      to partial-4-stretch grows from ~4.4x at slope=1 to ~11.5x at
      slope=2 to ~25.0x at slope=3 -- not a uniform rescale, a genuine
      reshaping. Cross-checked against the real filter (measured, not
      just idealized): partial-4 stretch at pivot=4 differs by more than
      5 cents between slope=1 and slope=3 at the same amount, confirmed
      in wg2Pipeline.test.js as a permanent regression check. One
      measured nuance, not a contradiction: because slope's entire effect
      runs through which B gets selected, two DIFFERENT (pivot,slope)
      pairs that happen to resolve to the SAME B produce IDENTICAL
      achieved curves (e.g. pivot=2/slope=2 and pivot=4/slope=1 and
      pivot=16/slope=0.5 all resolve to B~0.0245 at amount=60, and all
      three produced the exact same measured p2/p4/p8/p16 cents in the
      full grid sweep). slope and pivot are two different ways of
      SELECTING a B, each genuinely useful and non-redundant with
      `amount`, but not independently expressive once a specific B value
      is reached by either route.

- id: claim.b-safe-max-characterized-in-cents
  subject: component.dispersion-filter
  relation: clamping-B-to-0.05-tends-to-cause
  object: feature.fundamental-tuning-within-perceptual-tolerance
  conditions:
    - pitchLocked-mode
  expected_direction: stable (small cents error)
  confidence: high
  scope: component.dispersion-filter
  mechanism: >
    Same mechanism as claim.pitchlocked-compensation-keeps-fundamental-
    in-tune-across-stiffness -- groupDelaySamplesAt() compensates the
    rail length based on B/f0 alone, independent of which (pivot,slope)
    combination produced that B.
  possible_confounds:
    - percent-error-can-understate-perceptual-significance (a 1% error is
      ~17.2 cents -- RESOLVED by measuring and reporting in cents
      directly, per explicit instruction, rather than relying on percent
      alone)
    - fixed-small-DFT-windows-give-misleading-low-frequency-readings
      (a 4096-sample window captures too few cycles at low f0 for
      reliable frequency resolution, producing noisy, non-monotonic
      cents figures that looked like real tuning chaos at 55-110Hz during
      an early pass of this measurement -- RESOLVED by using a frequency-
      adaptive window, >=60 cycles of f0, minimum 8192 samples; a B=0
      sanity check then confirmed exactly 0.000 cents at every tested
      frequency, validating the corrected method before trusting its
      B>0 results)
  validation:
    method: fundamental-tuning-error-in-cents-vs-B,-corrected-frequency-adaptive-measurement,-55-1760Hz
    metric: cents-error-vs-B,-5-cent-and-10-cent-threshold-crossings
    result: >
      Clean (under ~1.1 cents) from 55-880Hz through B=0.05-0.06; 1760Hz
      crosses 5 cents around B=0.045 and 10 cents around B=0.05 --
      earlier and tighter than the lower frequencies, a real, frequency-
      dependent residual. DISPERSION_B_SAFE_MAX=0.05 (kept PROVISIONALLY,
      per explicit instruction) therefore stays under ~1.1 cents at
      55-880Hz but reaches ~10.6 cents at 1760Hz -- right at the stated
      10-cent tolerance, reported honestly in wg2Pipeline.test.js with a
      deliberately separate, looser assertion for that frequency rather
      than a single threshold that would either be too strict (flaky) or
      hide the residual by being too loose everywhere. Framed per
      explicit instruction as "the current limit of reliable pitch
      compensation, not a stability or final expressive limit" -- large B
      stays finite/stable/correctly-ordered far beyond this (tested to
      B=0.2 during the amount-widening step's own planning).

- id: claim.clamping-is-transparent-and-detects-dead-zones
  subject: component.dispersion-filter
  relation: reporting-unclampedB-clampedB-wasClamped-and-maxRealizableAmount-tends-to-cause
  object: feature.clamping-never-silent
  conditions: []
  expected_direction: always-reported-when-relevant
  confidence: high
  scope: component.dispersion-filter
  mechanism: >
    getTargetDescription() computes maxRealizableAmount directly from the
    forward formula (idealCentsAt(B_SAFE_MAX, pivot, slope)) rather than
    searching for it, so "how far can this combination go" is answerable
    cheaply on every call, not just when something has already gone
    wrong.
  possible_confounds: []
  validation:
    method: direct-struct-inspection-plus-a-dead-zone-regression-test
    metric: wasClamped-correctness-and-dead-zone-detection
    result: >
      At the default pivot=4/slope=2, stiffness=1 (amount=100):
      unclampedB==clampedB==0.00823, wasClamped=false, confirming the
      default ceiling stays entirely unclamped (matches the amount-
      widening step's own finding, re-verified here). At the extreme
      corner pivot=2/slope=0.5, stiffness=1 (amount=100): unclampedB=0.42,
      clampedB=0.05, wasClamped=true, maxRealizableAmount=16.9 -- meaning
      only ~17 of the requested 100 cents is actually achievable at that
      corner, fully visible via the struct rather than silently
      undershooting. Dead-zone check: at the same corner, stiffness=0.9
      and stiffness=1.0 both clamp to the IDENTICAL B (0.05) -- confirmed
      by a direct equality assertion in wg2Pipeline.test.js -- meaning
      pushing stiffness further in that region produces no additional
      audible change, exactly the "region where further movement produces
      little or no additional effect" the directive asked to be detected.
