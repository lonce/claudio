# CausalClaim records for WG2 (WaveguideResonator v1, Phase B).
#
# Every claim here is backed by an actual measurement from
# soundlib/models/WG2/wg2PipelineCore.js (via soundlib/utilities/test/
# wg2Pipeline.test.js and the scratch verification that preceded it), not
# asserted from physical intuition alone -- same discipline as
# soundlib/models/WG1/knowledge/causal-claims.yaml. frequency/energy/
# decayTime's basic behavior is unchanged from WG1's own record; the
# claims below are specific to what Phase B actually added.

- id: claim.excitation-position-creates-movable-modal-nulls
  subject: parameter.excitation-position
  relation: moving-toward-a-harmonics-node-tends-to-cause
  object: feature.suppressed-strength-of-that-harmonic
  conditions:
    - two-rail-bidirectional-waveguide
  expected_direction: suppress-at-node-present-elsewhere
  confidence: high
  scope: component.bidirectional-waveguide
  mechanism: pluck-at-a-position-cannot-excite-a-harmonic-whose-modal-shape-is-zero-there
  possible_confounds:
    - pickup-position-could-independently-null-the-same-harmonic (controlled for in validation by fixing pickup position while varying excitation position)
  validation:
    method: pluck-at-string-midpoint-vs-off-center-then-measure-per-harmonic-magnitude-via-single-bin-dft
    metric: even-harmonic-magnitude-ratio-midpoint-vs-off-center
    result: >
      At frequency=220Hz, pickupPosition fixed at 0.31: exciting at the
      midpoint (0.5) suppressed harmonics 2/4/6/8 by ratios of
      0.008/0.012/0.050/0.008 relative to exciting at 0.18 (off-center) --
      i.e. 20x-125x quieter. Odd harmonics 1/3/5/7 were NOT systematically
      suppressed under the same comparison (ratios 1.0-3.4x, noise-level
      variation, not a suppression pattern). This is the classic, textbook-
      predicted plucked-string modal-null behavior (a string plucked
      exactly at its midpoint cannot excite any even harmonic, since their
      mode shapes are zero there) -- measured directly, not assumed to
      follow from the DSP structure.

- id: claim.pickup-position-creates-movable-modal-nulls
  subject: parameter.pickup-position
  relation: moving-toward-a-harmonics-node-tends-to-cause
  object: feature.suppressed-strength-of-that-harmonic
  conditions:
    - two-rail-bidirectional-waveguide
  expected_direction: suppress-at-node-present-elsewhere
  confidence: high
  scope: component.point-pickup
  mechanism: observing-at-a-position-cannot-detect-a-harmonic-whose-modal-shape-is-zero-there
  possible_confounds:
    - excitation-position-could-independently-null-the-same-harmonic (controlled for in validation by fixing excitation position while varying pickup position)
  validation:
    method: fix-excitation-off-center-vary-pickup-position-then-measure-per-harmonic-magnitude
    metric: even-harmonic-magnitude-ratio-midpoint-vs-off-center
    result: >
      At frequency=220Hz, excitationPosition fixed at 0.18: observing at
      the midpoint (0.5) suppressed harmonics 2/4/6/8 by ratios of
      0.003/0.007/0.015/0.006 relative to observing at 0.29 (off-center) --
      60x-330x quieter. Confirms the null is genuinely a property of
      *where you observe*, independent of the excitation-position claim
      above, not just a restatement of it.

- id: claim.two-rail-structure-shortens-decay-more-than-single-loop
  subject: component.bidirectional-waveguide
  relation: increasing-tends-to-cause
  object: feature.shorter-than-WG1s-nominal-fundamental-decay-shortfall
  conditions:
    - static-frequency
    - linear-interpolation-still-in-use (HISTORICAL -- linear was the only
      interpolator when this claim was first written; lagrange3 is the
      default as of the interpolation-strategy investigation, see
      claim.lagrange3-resolves-wg2s-high-frequency-energy-collapse below.
      Kept because it's still an accurate description of the two-rail
      structure's effect specifically under linear interpolation, and
      it's the finding a rigorous follow-up critique demanded be properly
      isolated -- see that claim for the full isolation.)
  expected_direction: decrease
  confidence: high
  scope: component.bidirectional-waveguide
  mechanism: each-full-round-trip-now-crosses-two-separate-fractional-interpolation-taps-instead-of-one
  possible_confounds:
    - specific-frequency-tested-fractional-part-of-rail-length-not-swept-exhaustively (RESOLVED -- see claim.lagrange3-resolves-wg2s-high-frequency-energy-collapse's frequency-swept isolation, which supersedes this)
  validation:
    method: compare-measured-T60-to-analytical-prediction-at-frequency-220Hz
    metric: measured-T60-to-analytically-predicted-T60-ratio
    result: >
      At frequency=220Hz: decayTime=0.5s measured ratio 0.780, decayTime=2s
      measured ratio 0.670 -- both somewhat below WG1's own worst-case
      ~0.75 at the same frequency, consistent with (not proof of) the
      two-taps-per-trip mechanism. This was originally recorded at
      confidence "medium" pending a proper isolation with an exact-
      integer-railLength control and internal-energy (not just pickup)
      measurement, exactly as a subsequent rigorous critique demanded --
      that isolation was carried out (see the next claim) and raised this
      to "high": at MODERATE frequencies (up to ~440Hz) the fundamental-
      band decay shortfall for WG2 is close to WG1's own (0.975 vs 0.96 at
      220Hz, band-specific Goertzel measurement, not broadband RMS) --
      the two-rail structure's OWN contribution to fundamental-decay
      shortfall, independent of the interpolator-collapse effect, is
      small. The dramatic, topology-dependent divergence from WG1 is
      concentrated at HIGH frequencies and is a broadband/internal-energy
      effect, not primarily a fundamental-decay effect -- see next claim.

- id: claim.lagrange3-resolves-wg2s-high-frequency-energy-collapse
  subject: component.lagrange-interpolator
  relation: replacing-linear-with-tends-to-cause
  object: feature.wg2-internal-energy-preserved-across-most-of-the-supported-frequency-range
  conditions: []
  expected_direction: increase
  confidence: high
  scope: component.bidirectional-waveguide
  mechanism: >
    WG2's round trip crosses a fractional-delay interpolation tap TWICE
    (once per rail boundary), vs. WG1's once -- so any per-crossing
    magnitude rolloff compounds harder in WG2 than WG1. Swapping in an
    interpolator with a much gentler high-frequency rolloff (lagrange3,
    a 4-point/3rd-order FIR polynomial interpolator, vs. linear's 2-point
    straight-line fit) reduces each individual crossing's loss, so the
    doubled-crossing structure no longer compounds into a collapse.
  possible_confounds:
    - explicit-loss-filter-coefficient-bug (RULED OUT -- isolated with
      explicit loss disabled, decayTime forced near-infinite)
    - pickup-position-phase-cancellation (RULED OUT -- measured via
      internal stored energy, sum of squares across BOTH rail buffers,
      not just the pickup output)
  validation:
    method: >
      Same near-lossless internal-energy isolation technique as WG1's own
      claim.linear-interpolation-collapses-at-high-frequency, swept across
      55-3000Hz, compared for linear vs. lagrange3 (and vs. allpass1,
      which was evaluated and rejected on tuning/transient-stability
      grounds -- see WG1's own causal-claims.yaml for the full 3-way
      comparison; WG2-specific numbers recorded here).
    metric: internal-energy-T60-as-fraction-of-analytical-prediction-or-not-reached
    result: >
      Under linear interpolation, WG2 tracked WG1 closely below ~440Hz but
      collapsed to ~0.06/0.02 of nominal at 1760/3000Hz (vs. WG1's own
      roughly-constant ~0.72-0.77 across the whole range) -- confirming
      the doubled-crossing mechanism, not a WG2-specific bug. Under
      lagrange3, internal energy is fully preserved (T60 "not reached"
      within the render) at every tested frequency except the very top of
      the range: at 3000Hz, measured internal-energy T60 was ~1.4s rather
      than "not reached" -- a ~24x improvement over linear's ~0.058s
      there, but not a complete fix, and honestly recorded as a residual
      rather than claimed as fully solved. This matches the general
      pattern (WG2's doubled crossings make it the harder case, so a
      residual that's negligible for WG1 remains measurable, if greatly
      reduced, for WG2). Fundamental-band T60 accuracy across the same
      sweep stayed close to nominal at every frequency from 55-1760Hz,
      with a similarly weaker (but non-catastrophic) result at 3000Hz --
      see soundlib/utilities/test/wg2Pipeline.test.js's per-frequency
      threshold table for the exact measured ratios this claim is backed
      by. lagrange3 was selected as WG2's (and WG1's) shared default
      interpolator on this evidence -- see
      soundlib/utilities/createInterpolator.js.

- id: claim.pickup-type-changes-observed-signal-character
  subject: parameter.pickup-type
  relation: changing-value-tends-to-cause
  object: feature.distinctly-different-waveform
  conditions: []
  expected_direction: change
  confidence: high
  scope: component.point-pickup
  mechanism: displacement-is-rail-sum-velocity-is-rail-difference-bridgeForce-is-raw-pre-reflection-bridge-sample
  possible_confounds: []
  validation:
    method: render-same-pluck-under-each-pickup-type-compare-sample-by-sample
    metric: exact-non-equality-of-rendered-sample-arrays
    result: >
      At frequency=220Hz, pickupPosition=0.3: displacement, velocity, and
      bridgeForce each produced a distinct sample array (no two equal).
      displacement and velocity had similar RMS (0.0147 vs 0.0147);
      bridgeForce measurably lower (0.0104) -- expected, since it taps a
      single rail's raw pre-reflection value rather than a sum/difference
      of both.

- id: claim.stiffness-increases-inharmonicity
  subject: parameter.stiffness
  relation: increasing-tends-to-cause
  object: feature.partial-inharmonicity
  conditions:
    - dispersion-filter-enabled (i.e. stiffness above the bypass epsilon)
  expected_direction: increase
  confidence: high
  scope: component.dispersion-filter
  mechanism: frequency-dependent-phase-delay-from-a-cascade-of-first-order-allpass-sections
  possible_confounds:
    - coupled-resonators (not applicable here -- WG2 has no coupled
      second polarization yet)
    - interpolation-residual-phase-error (RULED OUT as the source of this
      effect specifically -- see "Distinguishing dispersion from
      interpolation residuals," below; stiffness=0's own measured tuning
      error matches the pre-existing, already-documented lagrange3
      baseline exactly, confirming this claim's effect is additional to,
      not a restatement of, that baseline)
    - analysis-resolution (the peak-search method's own frequency grid
      has finite resolution -- mitigated by using a dense 400-point
      search per measurement, not a fixed FFT bin)
  validation:
    method: partial-tracking-sweep (direct extension of this project's
      "measure, don't assume" discipline to the spec's own suggested
      CausalClaim validation method, section 9.2)
    metric: measured-partial-frequency-vs-nominal-n-times-f0
    result: >
      At frequency=220Hz, excitationPosition=0.15, pickupPosition=0.37:
      partial 8's measured frequency increased monotonically across
      stiffness=[0, 0.25, 0.5, 0.75, 1.0] (1760.55, 1767.70, 1783.10,
      1808.95, 1837.55 Hz). At a fixed stiffness=1.0, stretch amount
      (measured minus nominal) increased with partial number: partial 2
      stretched ~1.3Hz, partial 4 ~11Hz, partial 8 ~77.5Hz -- the
      intended physically-informed causal direction (higher stiffness,
      higher partial number, more stretch), confirmed by direct
      measurement rather than assumed from the closed-form formula alone.
      Measured partial frequencies also tracked the textbook target curve
      f_n = n*f0*sqrt(1+B*n^2)/sqrt(1+B) (for the internally-computed B at
      a given stiffness) within 0.6% across f0=[110, 220, 880]Hz,
      stiffness=[0.5, 1.0], partials n=[2, 4, 6] -- this is the strongest
      evidence the closed-form coefficient derivation (Rauhala & Valimaki,
      DAFX-2006, as implemented in Faust's misceffects.lib) is actually
      correctly implemented here, not merely "producing some stretching
      in roughly the right direction."

- id: claim.pitchlocked-compensation-keeps-fundamental-in-tune-across-stiffness
  subject: component.dispersion-filter
  relation: subtracting-groupDelaySamplesAt-from-rail-length-tends-to-cause
  object: feature.fundamental-frequency-stable-across-stiffness
  conditions:
    - pitchLocked-mode (the only mode implemented -- see
      components.yaml's future_affordances for lengthLocked)
  expected_direction: stable (near-zero additional drift as stiffness
    increases)
  confidence: high
  scope: component.dispersion-filter
  mechanism: >
    DispersionFilter.groupDelaySamplesAt(f0, sampleRate) returns the
    whole M-section cascade's own group delay at the fundamental, for the
    filter's current stiffness state; wg2Processor.js subtracts this from
    the geometric rail length each block, so total loop delay at f0
    (geometric + dispersion-filter-contributed) stays matched to the
    requested period regardless of how much extra phase the dispersion
    filter itself is adding.
  possible_confounds:
    - sign-convention-error-in-the-compensation-formula (a REAL risk
      flagged during implementation -- the source paper's own Faust
      reference exposes a pre-negated output tailored to ITS pipeline's
      own +(totalDelay) usage; DispersionFilter.js's groupDelaySamplesAt()
      deliberately uses a different, plain-positive convention matching
      its own name and this model's own subtraction usage. Confirmed
      correct by direct measurement on the FIRST implementation attempt,
      not assumed -- see validation.)
  validation:
    method: autocorrelation-style-peak-search-at-the-fundamental-across-a-stiffness-sweep
    metric: percent-error-vs-requested-frequency
    result: >
      At frequency=220Hz, across stiffness=[0, 0.1, 0.25, 0.5, 0.75, 1.0]:
      measured fundamental stayed within ~0.08% of 220Hz at every step
      (noise-level variation from the peak-search grid's own resolution,
      not a systematic drift with stiffness) -- confirming the
      compensation sign convention and formula are correct in this
      implementation, not merely in the source paper.

# --- Distinguishing dispersion, damping, interpolation residuals, and
# the stiffness mapping (per the design directive's own explicit request
# to record this distinction) ---
#
# dispersion (this file's two claims above, component.dispersion-filter):
#   frequency-dependent PROPAGATION TIME/PHASE, intentionally introduced,
#   zero at stiffness=0 (the filter bypasses entirely, not just a small
#   coefficient).
#
# damping (component.loop-loss-filter, soundlib/models/WG1/knowledge/
#   causal-claims.yaml's claim.decay-time-lengthens-decay): frequency-
#   independent (still broadband-only -- brightnessDecay, a frequency-
#   dependent loss control, remains unbuilt future Phase C work) MAGNITUDE
#   loss, controlled by decayTime, orthogonal to stiffness -- confirmed
#   independent by direct measurement (decayTime's T60-doubling-ish
#   scaling ratio stayed consistent, ~3.9-4.0x, across stiffness=0/0.5/1.0
#   in wg2Pipeline.test.js).
#
# interpolation residuals (component.lagrange-interpolator, this file's
#   claim.lagrange3-resolves-wg2s-high-frequency-energy-collapse and
#   claim.two-rail-structure-shortens-decay-more-than-single-loop above):
#   UNINTENTIONAL numerical phase/magnitude error from the delay-line
#   implementation itself, present even at stiffness=0 -- already
#   measured and documented as its own, separate, pre-existing baseline
#   BEFORE this dispersion work began. stiffness=0's own measured tuning
#   error (claim.pitchlocked-compensation-keeps-fundamental-in-tune-
#   across-stiffness's own stiffness=0 data point, ~0.08%) matches this
#   pre-existing baseline, confirming the two effects are not conflated:
#   the dispersion filter adds a NEW, deliberate, measured effect on top
#   of an unchanged numerical baseline, not a rebranding of the same
#   residual.
#
# stiffness (parameter.stiffness): the public, physically-informed macro
#   control mapped onto the dispersion model's internal target
#   inharmonicity coefficient B -- see components.yaml's "grounding"
#   field for exactly which part of this mapping is physical (the
#   B-to-allpass-coefficient derivation) vs. physically informed (the
#   stiffness-to-B curve itself).
